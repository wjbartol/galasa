# PersistentVolumeClaim for the Galasa API server test catalog storage
# Concrete version (no template variables) for kind cluster use (TASK-031)
#

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-api
  namespace: galasa
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
