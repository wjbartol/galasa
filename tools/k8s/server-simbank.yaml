#
# Galasa SimBank (SimPlatform) Deployment + Service
# Concrete version (no template variables) for kind cluster use (TASK-031)
# Image: galasadev/galasa-simplatform-amd64:0.18.0
#

apiVersion: apps/v1
kind: Deployment
metadata:
  name: simbank
  namespace: galasa
  labels:
    app: simbank
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simbank
  template:
    metadata:
      name: simbank
      labels:
        app: simbank
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
      - name: simbank
        image: galasadev/galasa-simplatform-amd64:0.18.0
        imagePullPolicy: IfNotPresent
        command: ["java"]
        args:
        - -jar
        - simplatform.jar
        ports:
        - containerPort: 2023
          name: telnet
        - containerPort: 2080
          name: webservice
        - containerPort: 2027
          name: database
        - containerPort: 2040
          name: mf
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "250m"

---

apiVersion: v1
kind: Service
metadata:
  name: simbank
  namespace: galasa
  labels:
    app: simbank
spec:
  ports:
  - port: 2023
    name: telnet
    targetPort: 2023
  - port: 2080
    name: webservice
    targetPort: 2080
  - port: 2027
    name: database
    targetPort: 2027
  - port: 2040
    name: mf
    targetPort: 2040
  selector:
    app: simbank
