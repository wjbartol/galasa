#
# TestCatalog ConfigMap — tells the API server where to write the test catalog
# Concrete version (no template variables) for kind cluster use (TASK-031)
#

apiVersion: v1
kind: ConfigMap
metadata:
  name: testcatalog-file
  namespace: galasa
data:
  dev.galasa.testcatalog.cfg: |
    framework.testcatalog.directory=file:/galasa/testcatalog
